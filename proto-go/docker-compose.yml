version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: gebrauchtwagen
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  app:
    image: golang:1.20
    working_dir: /app
    volumes:
      - ./:/app
    command: ["bash","-lc","go run ."]
    environment:
      - DATABASE_URL=postgres://postgres:example@db:5432/gebrauchtwagen?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
